name: 데일리 브리핑

# 맥이 꺼져 있어도 돌게 하려고 launchd 대신 여기서 돌린다.
# GitHub Actions의 cron은 UTC 기준이고, 실행이 수 분~수십 분 늦어질 수 있다.
# (실측으로는 1~2시간 반까지 밀린다. 아래 시각은 '이보다 이르지는 않다'는 뜻으로 읽을 것.)
#
# ---- 2026-09-16: 매시 자동 실행으로 재개 / 2026-09-19: 시각 버킷 → catch-up으로 수정 ----
# 매시 10분에 한 번씩 돈다(cron '10 * * * *' 하나뿐). 무엇을 할지는 pipeline/pick_job.py가
# 정한다 — 자세한 규칙과 이유는 그 파일 상단 주석.
#
# 처음엔 "실행이 시작된 시각의 KST 시"로 정했다(16시대면 국내 마감, 7시대면 미국 마감).
# 그런데 GitHub 크론은 best-effort라 1~2시간씩 밀리고(커밋 시각으로 실측),
# 16:10 예정 실행이 17시에 시작하면 '장 닫힘 → 건너뜀'으로 떨어져 마감 브리핑이
# 통째로 사라졌다. 9/16~9/18 사흘 동안 국내 마감 전체 갱신이 한 번도 안 돌았다.
# 예전 방식(크론 문자열로 작업을 구분)은 밀려도 안 흔들렸는데 그 내성을 내가 없앴던 것.
# 지금은 "오늘 그 시각 이후 전체 갱신이 이미 됐나"를 data/briefing.json의 refreshed_at
# 으로 보고, 안 됐으면 이번 실행이 채운다 — 밀리거나 하나 걸러도 다음 실행이 메운다.
#
#   미국 마감(전체)  KST 07~15시 사이 첫 실행 (오늘 07:00 이후 미국 전체 갱신이 아직이면)
#   국내 마감(전체)  KST 18~21시 사이 첫 실행 (오늘 18:00 이후 국내 전체 갱신이 아직이면)
#   국내 장중 슬롯   KST 09~15시 (미국 전체 갱신이 끝난 뒤), --slots-only
#   해외 장중 슬롯   KST 22~06시, --slots-only (자정을 넘는 구간)
#   그 외            건너뜀(market을 비워 이후 스텝이 안 돈다 — 빈 실행 방지)
#
# 각 실행이 그날 지나간 시점을 통째로 다시 뽑으므로(intraday.py) 슬롯도 마찬가지로
# 밀리거나 하나 걸러도 다음 실행이 알아서 메운다.
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      market:
        description: '갱신할 시장'
        type: choice
        options: [auto, us, kr, all]
        default: auto
      slots_only:
        description: '시간대별 슬롯만 갱신 (마감 브리핑은 그대로 둔다)'
        type: boolean
        default: false

# 결과를 저장소에 되커밋해야 해서 쓰기 권한이 필요하다
permissions:
  contents: write

# ---- 2026-09-17: 실행이 몇 시간씩 밀리는 문제 대응 ----
# 09:21 KST 실행 뒤로 10:10/11:10/12:10/13:10 KST에 돌았어야 할 실행이 전부
# 커밋을 안 남겼다(로그를 직접 볼 권한이 없어 확정은 못 했다 — Actions 탭에서
# 확인 필요). pipeline/prices.py·intraday.py의 yfinance 호출(야후 파이낸스)에
# 타임아웃이 전혀 없다는 걸 코드에서 확인했다 — GitHub Actions 러너는 IP 대역이
# 공유라 야후에 종종 막히거나 느려지는데, 그러면 requests가 기본값(무제한)
# 타임아웃이라 그 실행이 안 끝나고 붙잡혀 있을 수 있다. concurrency가
# cancel-in-progress:false라 그러면 그 뒤 정각마다 잡히는 실행들이 전부 그
# 뒤에 줄을 서서 기다리게 된다 — 한 번 걸리면 몇 시간이고 아무 것도 안 도는
# 증상과 정확히 들어맞는다.
#
# yfinance 호출마다 타임아웃을 넣는 게 더 근본적인 수정이지만(호출 지점이
# 여러 곳이라 위험도가 크다), 우선 훨씬 안전한 두 가지로 막는다:
#   1) timeout-minutes로 실행 자체에 상한을 둔다(로컬 실측 1분 안팎이라
#      8분/15분이면 넉넉하다) — 뭐가 됐든 무한정 붙잡혀 있을 수 없다.
#   2) cancel-in-progress:true — 이전 실행이 막혀 있어도 새 스케줄이 오면
#      그 실행을 취소하고 새로 시작한다(매 실행이 그날 지나간 시점을 통째로
#      다시 계산해서 만들어내므로 취소돼도 잃을 상태가 없다 — 안전하다).
concurrency:
  group: briefing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: 어느 시장을 어떻게 갱신할지 정한다
        id: pick
        # cron이 '10 * * * *' 하나뿐이라 문자열로는 작업을 구분할 수 없다. 대신
        # pipeline/pick_job.py가 시각 + 데이터(refreshed_at)로 정한다. 값을 env로
        # 받는다 — ${{ }}를 스크립트 본문에 바로 펼치면 입력이 셸 코드로
        # 섞여 들어간다.
        env:
          MARKET_IN: ${{ inputs.market }}
          SLOTS_IN: ${{ inputs.slots_only }}
        run: |
          if [ -n "$MARKET_IN" ]; then          # 손으로 돌린 경우
            market="$MARKET_IN"
            slots=""
            if [ "$SLOTS_IN" = "true" ]; then slots="--slots-only"; fi
          else
            # 시각이 아니라 데이터로 정한다(밀림 내성) — pipeline/pick_job.py 참고
            IFS='|' read -r market slots <<< "$(python pipeline/pick_job.py)"
          fi
          echo "market=$market" >> "$GITHUB_OUTPUT"
          echo "slots=$slots"   >> "$GITHUB_OUTPUT"
          if [ -z "$market" ]; then
            echo "→ 지금은 할 일이 없어 건너뜀(장이 닫혀 있거나 전체 갱신이 이미 끝남)"
          else
            echo "→ market=$market ${slots:-(마감 브리핑 전체)}"
          fi

      - name: 브리핑 생성
        if: steps.pick.outputs.market != ''
        timeout-minutes: 8   # yfinance가 응답 없이 붙잡는 경우를 겨냥한 상한(위 설명 참고)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 카카오톡 알림용. 없으면 발송만 조용히 건너뛰고 브리핑은 그대로 만든다.
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          python pipeline/run_daily.py \
            --market ${{ steps.pick.outputs.market }} ${{ steps.pick.outputs.slots }}

      - name: 결과 커밋
        if: steps.pick.outputs.market != ''
        run: |
          git config user.name  'notefolio-bot'
          git config user.email 'notefolio-bot@users.noreply.github.com'
          git add data/briefing.js data/briefing.json briefings/
          # 내용이 그대로면 커밋하지 않는다(빈 커밋 방지)
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            what='${{ steps.pick.outputs.market }}'
            if [ -n '${{ steps.pick.outputs.slots }}' ]; then what="$what 시간대별"; fi
            git commit -m "브리핑 갱신 ($what) [skip ci]"
            # 매시 도는 만큼, 체크아웃 뒤 사람이 밀어넣은 커밋과 부딪힐 자리가
            # 늘었다. 리베이스로 얹고 민다.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
