name: 데일리 브리핑

# 맥이 꺼져 있어도 돌게 하려고 launchd 대신 여기서 돌린다.
# GitHub Actions의 cron은 UTC 기준이고, 실행이 수 분~수십 분 늦어질 수 있다.
# (실측으로는 1~2시간 반까지 밀린다. 아래 시각은 '이보다 이르지는 않다'는 뜻으로 읽을 것.)
#
# 마감 브리핑 — 홈 탭과 포트폴리오 탭을 통째로 갱신한다
#   22:00 UTC = 07:00 KST  미국 증시 마감
#   07:30 UTC = 16:30 KST  한국 증시 마감
#
# 미국은 07:00보다 당길 수 없다 — 현지 마감이 서머타임엔 KST 05:00, 겨울엔 06:00이라
# 07:00이 사계절 안전선이다. 당기면 겨울에 전일 종가를 잡는다(README '알아둘 것' 참고).
# 국내는 15:30 마감이라 원래 18:00은 두 시간 반을 놀렸다. 카톡 알림을 저녁에 받으려고
# 16:30으로 당겼다. 마감 후 뉴스를 그만큼 덜 모으는 것이 대가다.
#
# 장중 갱신 — 포트폴리오 탭의 시간대별 슬롯만 채운다(--slots-only)
# 국내 슬롯은 9:10 / 10:30 / 1:00 / 마감이고, 지나간 시점만 채워진다.
# 각 실행은 그날 5분봉을 통째로 받아 지나간 시점을 다시 다 뽑으므로,
# 실행이 밀리거나 하나 걸러 실패해도 다음 실행이 알아서 메운다.
#   00:20 UTC = 09:20 KST  9:10 슬롯
#   01:40 UTC = 10:40 KST  10:30 슬롯까지
#   04:10 UTC = 13:10 KST  1:00 슬롯까지
# 해외는 슬롯이 11:00PM·마감 둘뿐이고 KST 새벽에 다 지나가서, 아침 7시 마감
# 실행 한 번이면 이미 둘 다 채워진다. 장중 갱신을 따로 두지 않는다.
# ---- 2026-09-03: 서비스 중단 ----
# 자동 실행을 멈춘다. 아래 schedule 주석을 풀면 그대로 되살아난다.
# 워크플로 파일을 지우지 않은 것은 손으로 돌릴 길(workflow_dispatch)을 남겨두기 위해서다.
# 멈추면 브리핑 생성·되커밋·카카오톡 알림이 함께 멈춘다.
on:
  # schedule:
  #   - cron: '0 22 * * *'
  #   - cron: '30 7 * * *'
  #   - cron: '20 0 * * 1-5'
  #   - cron: '40 1 * * 1-5'
  #   - cron: '10 4 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: '갱신할 시장'
        type: choice
        options: [auto, us, kr, all]
        default: auto
      slots_only:
        description: '시간대별 슬롯만 갱신 (마감 브리핑은 그대로 둔다)'
        type: boolean
        default: false

# 결과를 저장소에 되커밋해야 해서 쓰기 권한이 필요하다
permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r pipeline/requirements.txt

      - name: 어느 시장을 어떻게 갱신할지 정한다
        id: pick
        # 크론 문자열은 위 schedule 목록과 글자 그대로 같아야 한다.
        # 값을 env로 받는다 — ${{ }}를 스크립트 본문에 바로 펼치면 입력이
        # 셸 코드로 섞여 들어간다.
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MARKET_IN: ${{ inputs.market }}
          SLOTS_IN: ${{ inputs.slots_only }}
        run: |
          if [ -n "$MARKET_IN" ]; then          # 손으로 돌린 경우
            market="$MARKET_IN"
            slots=""
            if [ "$SLOTS_IN" = "true" ]; then slots="--slots-only"; fi
          else
            case "$SCHEDULE" in
              '0 22 * * *') market=us; slots="" ;;
              '30 7 * * *') market=kr; slots="" ;;
              *)            market=kr; slots="--slots-only" ;;
            esac
          fi
          echo "market=$market" >> "$GITHUB_OUTPUT"
          echo "slots=$slots"   >> "$GITHUB_OUTPUT"
          echo "→ market=$market ${slots:-(마감 브리핑 전체)}"

      - name: 브리핑 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 카카오톡 알림용. 없으면 발송만 조용히 건너뛰고 브리핑은 그대로 만든다.
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          python pipeline/run_daily.py \
            --market ${{ steps.pick.outputs.market }} ${{ steps.pick.outputs.slots }}

      - name: 결과 커밋
        run: |
          git config user.name  'notefolio-bot'
          git config user.email 'notefolio-bot@users.noreply.github.com'
          git add data/briefing.js data/briefing.json briefings/
          # 내용이 그대로면 커밋하지 않는다(빈 커밋 방지)
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            what='${{ steps.pick.outputs.market }}'
            if [ -n '${{ steps.pick.outputs.slots }}' ]; then what="$what 시간대별"; fi
            git commit -m "브리핑 갱신 ($what) [skip ci]"
            # 하루 다섯 번까지 늘어나서, 체크아웃 뒤 사람이 밀어넣은 커밋과
            # 부딪힐 자리가 생겼다. 리베이스로 얹고 민다.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
